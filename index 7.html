const CFG={judul:'Ulangan Harian',mapel:'Ekonomi',sekolah:'MA Jamiat Kheir',kelas:'Kelas 10 / Fase E',durasi:120,maxViol:3};
const L='ABCDE',SK='cbt_state_v2';
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,Q=[],AD=null,PW='',timer=null,navOpen=false;

const sec=q=>q.t==='pg'?'Pilihan Ganda':q.t==='is'?'Isian Singkat':'Benar / Salah';
async function call(a,d){
 try{
  if(!/^https:\/\/script\.google\.com\//.test(API))return {ok:false,msg:'Alamat Web App belum diisi di file HTML (baris const API).'};
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:a},d||{}))});
  return await r.json();
 }catch(e){return {ok:false,msg:'Gagal terhubung ke server. Periksa internet dan pengaturan deploy Web App.'}}
}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.remove('hidden');$('#modal').classList.add('flex')}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').classList.remove('flex')}
function busy(b,id,t){const e=$(id);if(e){e.disabled=b;if(t)e.textContent=b?'Memproses...':t}}

/* ===== LOGIN ===== */
function loginView(tab){
 tab=tab||'siswa';
 $('#app').innerHTML=`<div class="max-w-md mx-auto pt-8 pb-8 px-4">
 <div class="text-center text-white mb-5"><div class="flex justify-center mb-3">${logo(104)}</div>
 <div class="ar text-2xl" style="color:#f3d36b">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
 <h1 class="ar text-3xl font-bold mt-1">${esc(CFG.judul)} ${esc(CFG.mapel)}</h1>
 <p class="text-sm opacity-90">${esc(CFG.sekolah)} · ${esc(CFG.kelas)}</p><p class="text-xs opacity-75">${CFG.durasi} menit</p></div>
 <div class="frame p-5"><div class="flex mb-4 bg-emerald-50 rounded-lg p-1 text-sm">
 <button onclick="loginView('siswa')" class="flex-1 py-2 rounded-md ${tab=='siswa'?'btn-green':''}">Siswa</button>
 <button onclick="loginView('admin')" class="flex-1 py-2 rounded-md ${tab=='admin'?'btn-green':''}">Guru / Admin</button></div>
 ${tab=='siswa'?`<label class="text-sm">Nama lengkap</label><input id="nm" class="inp mb-3" placeholder="Nama sesuai daftar">
 <label class="text-sm">Token akses</label><input id="tk" class="inp mb-4" placeholder="Contoh: ECO001">
 <button id="bt" onclick="loginSiswa()" class="w-full btn-gold rounded-lg py-2.5">Mulai Ujian</button>`
 :`<label class="text-sm">Password admin</label><input id="pw" type="password" class="inp mb-4">
 <button id="bt" onclick="loginAdmin()" class="w-full btn-green rounded-lg py-2.5">Masuk Dashboard</button>`}
 <p id="err" class="text-red-600 text-sm mt-3"></p></div>
 <p class="text-center text-xs text-white/70 mt-4">Dilarang berpindah tab/jendela. ${CFG.maxViol} pelanggaran = akun diblokir.</p></div>`;
}
async function loginSiswa(){
 const n=$('#nm').value.trim(),t=$('#tk').value.trim().toUpperCase();
 if(!n||!t){$('#err').textContent='Isi nama dan token.';return}
 busy(true,'#bt','Mulai Ujian');$('#err').textContent='';
 const d=await call('login',{nama:n,token:t});
 if(!d.ok){busy(false,'#bt','Mulai Ujian');$('#err').textContent=d.msg||'Gagal masuk.';return}
 const old=ld(SK,null),end=Date.now()+(d.end-d.now);
 if(old&&norm(old.nama)===norm(d.nama)){S=old;S.viol=Math.max(old.viol||0,d.viol||0);S.end=end;S.soal=d.soal}
 else S={nama:d.nama,kelas:d.kelas,token:t,soal:d.soal,ans:{},ragu:{},cur:0,viol:d.viol||0,end:end};
 Q=S.soal;sv(SK,S);
 if(S.viol>=CFG.maxViol){submit(false,true);return}
 examView();
}
async function loginAdmin(){
 PW=$('#pw').value;busy(true,'#bt','Masuk Dashboard');
 const r=await call('aget',{pass:PW});
 if(!r.ok){busy(false,'#bt','Masuk Dashboard');$('#err').textContent=r.msg||'Password salah.';return}
 AD=r;adminView('rekap');
}

/* ===== UJIAN ===== */
function examView(){
 $('#app').innerHTML=`<header class="bar text-white px-3 py-2 flex items-center justify-between gap-2 sticky top-0 z-10">
 <div class="flex items-center gap-2 min-w-0">${logo(38)}<div class="min-w-0"><div class="ar font-bold truncate">${esc(CFG.judul)} ${esc(CFG.mapel)}</div><div class="text-xs opacity-80 truncate">${esc(CFG.sekolah)} · ${esc(S.nama)}</div></div></div>
 <div class="flex items-center gap-2"><span id="tm" class="bg-red-600 rounded-md px-2 py-1 font-mono text-sm">--:--:--</span>
 <button onclick="navOpen=!navOpen;drawNav()" class="lg:hidden btn-gold rounded-md px-2 py-1 text-sm">Daftar</button></div></header>
 <div class="max-w-6xl mx-auto p-3 grid lg:grid-cols-[1fr_290px] gap-4"><main id="main"></main><aside id="nav" class="hidden lg:block"></aside></div>`;
 draw();tick();clearInterval(timer);timer=setInterval(tick,1000);
}
function tick(){
 const r=Math.max(0,S.end-Date.now()),h=Math.floor(r/3600000),m=Math.floor(r%3600000/60000),s=Math.floor(r%60000/1000);
 const e=$('#tm');if(e)e.textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
 if(r<=0&&!S.done){clearInterval(timer);submit(true)}
}
function draw(){drawMain();drawNav()}
function drawMain(){
 const i=S.cur,q=Q[i],a=S.ans[i];let body='';
 if(q.t==='pg')body=q.o.map((o,j)=>!o?'':`<button onclick="setA(${i},${j})" class="w-full text-left flex gap-3 p-3 mb-2 rounded-lg border-2 ${a===j?'border-emerald-600 bg-emerald-50':'border-amber-200 bg-white'}"><span class="font-bold w-5">${L[j]}.</span><span>${esc(o)}</span></button>`).join('');
 else if(q.t==='bs')body=[[true,'Benar'],[false,'Salah']].map(([v,t])=>`<button onclick="setA(${i},${v})" class="w-full text-left p-3 mb-2 rounded-lg border-2 ${a===v?'border-emerald-600 bg-emerald-50':'border-amber-200 bg-white'}">${t}</button>`).join('');
 else body=`<input value="${esc(a||'')}" oninput="setA(${i},this.value,1)" class="inp" style="padding:12px" placeholder="Ketik jawaban singkat di sini">`;
 $('#main').innerHTML=`<div class="frame p-4">
 <div class="flex justify-between items-center mb-3"><h2 class="ar text-xl font-bold text-emerald-800">Soal Nomor ${i+1}</h2><span class="text-xs bg-amber-100 text-amber-800 rounded px-2 py-1">${sec(q)} · bobot ${q.w||2}</span></div>
 <p class="mb-4 leading-relaxed">${esc(q.q)}</p>${body}
 <div class="flex gap-2 mt-4"><button onclick="go(${i-1})" ${i==0?'disabled':''} class="flex-1 py-2 rounded-lg bg-slate-300 disabled:opacity-40">Sebelumnya</button>
 <button onclick="toggleRagu()" class="flex-1 py-2 rounded-lg ${S.ragu[i]?'bg-amber-600 text-white':'bg-amber-400'}">Ragu-ragu</button>
 <button onclick="go(${i+1})" ${i==Q.length-1?'disabled':''} class="flex-1 py-2 rounded-lg btn-green disabled:opacity-40">Selanjutnya</button></div></div>`;
}
function drawNav(){
 const n=$('#nav');if(!n)return;
 n.className=(navOpen?'':'hidden ')+'lg:block';
 let g='';for(let i=0;i<Q.length;i++){
  const d=S.ans[i]!==undefined&&S.ans[i]!=='';
  const c=S.ragu[i]?'bg-amber-400':d?'bg-emerald-600 text-white':'bg-slate-200';
  g+=`<button onclick="go(${i});navOpen=false" class="h-9 rounded ${c} text-sm ${i===S.cur?'ring-2 ring-offset-1 ring-yellow-600':''}">${i+1}</button>`}
 const done=Object.values(S.ans).filter(v=>v!==''&&v!==undefined).length;
 n.innerHTML=`<div class="frame p-4"><h3 class="ar font-bold mb-2 text-emerald-800">Penjelajah soal (${done}/${Q.length})</h3>
 <div class="grid grid-cols-6 lg:grid-cols-5 gap-1.5">${g}</div>
 <div class="text-xs mt-3 text-slate-500">Abu: belum · Hijau: terjawab · Kuning: ragu</div>
 <div class="text-xs mt-1 text-red-600 font-semibold">Pelanggaran: ${S.viol}/${CFG.maxViol}</div>
 <button onclick="confirmSubmit()" class="w-full mt-3 py-2 rounded-lg btn-gold">Kirim &amp; Selesai</button></div>`;
}
function setA(i,v,noDraw){S.ans[i]=v;sv(SK,S);noDraw?drawNav():draw()}
function go(i){if(i<0||i>=Q.length)return;S.cur=i;sv(SK,S);draw();window.scrollTo(0,0)}
function toggleRagu(){S.ragu[S.cur]=!S.ragu[S.cur];sv(SK,S);draw()}
function confirmSubmit(){
 const done=Object.values(S.ans).filter(v=>v!==''&&v!==undefined).length,rg=Object.values(S.ragu).filter(Boolean).length;
 modal(`<h3 class="ar font-bold text-xl mb-2 text-emerald-800">Kirim jawaban?</h3><p class="text-sm mb-4">Terjawab ${done} dari ${Q.length} soal. Ragu-ragu: ${rg}. Setelah dikirim, jawaban tidak bisa diubah.</p>
 <div class="flex gap-2"><button onclick="closeModal()" class="flex-1 py-2 rounded-lg bg-slate-200">Kembali</button><button onclick="submit(false)" class="flex-1 py-2 rounded-lg btn-green">Ya, kirim</button></div>`);
}
async function submit(auto,blocked){
 clearInterval(timer);S.done=true;
 modal('<p class="text-center py-4">Mengirim jawaban...</p>');
 const d=await call('submit',{nama:S.nama,token:S.token,ans:S.ans,viol:S.viol});
 if(!d.ok){modal(`<h3 class="ar font-bold text-xl text-red-600 mb-2">Gagal mengirim</h3><p class="text-sm mb-4">${esc(d.msg||'Koneksi bermasalah.')} Jawabanmu aman di perangkat ini. Pastikan internet aktif lalu coba lagi.</p><button onclick="submit(${!!auto},${!!blocked})" class="w-full py-2 rounded-lg btn-green">Coba kirim lagi</button>`);return}
 localStorage.removeItem(SK);
 const nm=S.nama;
 if(d.blocked){modal(`<h3 class="ar font-bold text-xl text-red-600 mb-2">Akun Diblokir</h3><p class="text-sm mb-4">Kamu melakukan ${CFG.maxViol} pelanggaran (keluar dari halaman ujian). Jawabanmu dikirim otomatis dan akunmu diblokir. Hubungi guru.</p><button onclick="closeModal();S=null;loginView()" class="w-full py-2 rounded-lg bg-red-600 text-white">Tutup</button>`);return}
 modal(`<h3 class="ar font-bold text-xl text-emerald-800 mb-1">${auto?'Waktu habis, jawaban terkirim':'Jawaban terkirim'}</h3>
 <p class="text-sm text-slate-500 mb-3">${esc(nm)}</p>
 <div class="text-center bg-emerald-50 rounded-lg p-4 mb-3"><div class="text-4xl font-bold text-emerald-700">${d.nilai}</div><div class="text-sm">Benar ${d.benar} · Salah ${d.salah}</div></div>
 <button onclick="closeModal();S=null;loginView()" class="w-full py-2 rounded-lg btn-green">Selesai</button>`);
}

/* ===== ADMIN ===== */
function adminShell(tab,c){
 const T=(k,t)=>`<button onclick="adminView('${k}')" class="px-3 py-2 rounded-lg text-sm whitespace-nowrap ${tab==k?'btn-gold':'bg-white/90'}">${t}</button>`;
 $('#app').innerHTML=`<div class="max-w-5xl mx-auto p-3"><div class="flex items-center justify-between mb-3 text-white"><div class="flex items-center gap-3">${logo(46)}<div><div class="ar text-xl font-bold">Dashboard Guru</div><div class="text-xs opacity-80">${esc(CFG.sekolah)} · ${esc(CFG.mapel)}</div></div></div><div class="text-sm flex gap-3"><button onclick="refresh('${tab}')" class="underline">Muat ulang</button><button onclick="PW='';AD=null;loginView()" class="underline">Keluar</button></div></div>
 <div class="flex gap-2 mb-4 overflow-x-auto pb-1">${T('rekap','Rekap nilai')}${T('pelanggaran','Pelanggaran')}${T('siswa','Akun siswa')}${T('soal','Kelola soal')}</div><div class="frame p-3">${c}</div></div>`;
}
const TH='bg-emerald-50 text-left text-emerald-900';
async function refresh(tab){modal('<p class="text-center py-4">Memuat data...</p>');const r=await call('aget',{pass:PW});closeModal();if(!r.ok){alert(r.msg||'Gagal memuat data');return}AD=r;adminView(tab)}
async function adm(a,d,tab){modal('<p class="text-center py-4">Menyimpan ke server...</p>');const r=await call(a,Object.assign({pass:PW},d||{}));closeModal();if(!r.ok){alert(r.msg||'Gagal menyimpan');return false}await refresh(tab);return true}
function adminView(tab){
 const h=AD.hasil,Qa=AD.soal;let c='';
 if(tab==='rekap'){
  c=`<div class="flex gap-2 mb-3"><button onclick="exportCSV()" class="px-3 py-2 rounded-lg btn-green text-sm">Unduh CSV</button>
  <button onclick="if(confirm('Hapus semua hasil ujian? Semua siswa bisa mengerjakan ulang.'))adm('ahapus',{},'rekap')" class="px-3 py-2 rounded-lg bg-red-100 text-red-700 text-sm">Hapus semua</button></div>
  <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="${TH}"><tr><th class="p-2">Waktu</th><th>Nama</th><th>Kelas</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Pindah tab</th><th>Status</th></tr></thead><tbody>
  ${h.map(r=>`<tr class="border-t ${r.status==='DIBLOKIR'?'bg-red-50 text-red-700':''}"><td class="p-2">${esc(r.waktu)}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td class="font-semibold">${esc(r.nilai)}</td><td>${esc(r.benar)}</td><td>${esc(r.salah)}</td><td>${esc(r.viol)}x</td><td>${esc(r.status)}</td></tr>`).join('')||'<tr><td class="p-3 text-slate-500" colspan="8">Belum ada hasil.</td></tr>'}</tbody></table></div>`;
 }else if(tab==='pelanggaran'){
  const v=AD.viol.slice().sort((a,b)=>b.count-a.count);
  c=`<p class="text-sm text-slate-600 mb-3">Siswa yang keluar halaman ujian. Pada ${CFG.maxViol}x pelanggaran akun otomatis diblokir.</p><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="${TH}"><tr><th class="p-2">Nama</th><th>Pelanggaran</th><th>Status</th><th>Terakhir</th><th></th></tr></thead><tbody>
  ${v.map(r=>`<tr class="border-t"><td class="p-2 font-medium">${esc(r.nama)}</td><td>${esc(r.count)}x keluar</td><td>${r.blocked?'<span class="text-red-600 font-semibold">DIBLOKIR</span>':'Aktif'}</td><td>${esc(r.waktu)}</td><td>${r.blocked?`<button onclick="unblock('${esc(r.key)}','${esc(r.nama)}')" class="px-2 py-1 rounded btn-gold text-xs">Buka blokir</button>`:''}</td></tr>`).join('')||'<tr><td class="p-3 text-slate-500" colspan="5">Belum ada pelanggaran.</td></tr>'}</tbody></table></div>`;
 }else if(tab==='siswa'){
  c=`<div class="grid sm:grid-cols-[1fr_1fr_auto_auto] gap-2 mb-4"><input id="sn" class="inp" placeholder="Nama lengkap"><input id="st" class="inp" placeholder="Token"><button onclick="rndTok()" class="px-3 rounded-lg bg-amber-100 text-sm">Acak</button><button onclick="addSiswa()" class="px-4 py-2 rounded-lg btn-green text-sm">Tambah</button></div>
  <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="${TH}"><tr><th class="p-2">Nama</th><th>Kelas</th><th>Token</th><th></th></tr></thead><tbody>${AD.siswa.map((s,i)=>`<tr class="border-t"><td class="p-2">${esc(s[0])}</td><td>${esc(s[1])}</td><td class="font-mono">${esc(s[2])}</td><td><button onclick="delSiswa(${i})" class="text-red-600 text-xs">Hapus</button></td></tr>`).join('')||'<tr><td class="p-3 text-slate-500" colspan="4">Belum ada siswa.</td></tr>'}</tbody></table></div>`;
 }else{
  c=`<div class="flex gap-2 mb-3"><button onclick="editView(-1)" class="px-3 py-2 rounded-lg btn-green text-sm">+ Tambah soal</button><button onclick="if(confirm('Kembalikan semua soal ke bawaan? Perubahanmu hilang.'))adm('areset',{},'soal')" class="px-3 py-2 rounded-lg bg-slate-100 text-sm">Reset ke soal bawaan</button></div>
  <div class="text-sm">${Qa.map((q,i)=>`<div class="flex items-center gap-2 border-t py-2"><b class="w-7">${i+1}.</b><div class="flex-1 min-w-0"><div class="truncate">${esc(q.q)}</div><div class="text-xs text-slate-500">${sec(q)} · kunci: <span class="text-emerald-700 font-semibold">${q.t==='pg'?L[q.k]:q.t==='bs'?(q.k?'Benar':'Salah'):(q.g?'min. 2 poin':(q.k||[]).join(' / '))}</span> · bobot ${q.w||2}</div></div><button onclick="editView(${i})" class="text-emerald-700 text-xs">Edit</button><button onclick="delQ(${i})" class="text-red-600 text-xs">Hapus</button></div>`).join('')}</div>`;
 }
 adminShell(tab,c);
}
function rndTok(){$('#st').value='ECO'+Math.random().toString(36).slice(2,6).toUpperCase()}
function addSiswa(){
 const n=$('#sn').value.trim().replace(/\s+/g,' '),t=$('#st').value.trim().toUpperCase();
 if(!n||!t){alert('Nama dan token wajib diisi');return}
 if(AD.siswa.some(s=>norm(s[0])===norm(n))){alert('Nama sudah terdaftar');return}
 if(AD.siswa.some(s=>String(s[2]).toUpperCase()===t)){alert('Token sudah dipakai siswa lain');return}
 adm('asiswa',{siswa:AD.siswa.concat([[n,'X',t]])},'siswa');
}
function delSiswa(i){if(confirm('Hapus akun '+AD.siswa[i][0]+'?'))adm('asiswa',{siswa:AD.siswa.filter((_,j)=>j!==i)},'siswa')}
function unblock(k,n){if(confirm('Buka blokir '+n+'? Hasil terblokirnya dihapus agar bisa mengulang.'))adm('aunblock',{key:k},'pelanggaran')}
function exportCSV(){
 const rows=[['Waktu','Nama','Kelas','Nilai','Benar','Salah','Pindah Tab','Status']].concat(AD.hasil.map(r=>[r.waktu,r.nama,r.kelas,r.nilai,r.benar,r.salah,r.viol,r.status]));
 const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rekap_nilai.csv';a.click();
}
function editView(idx){
 const q=idx>=0?AD.soal[idx]:{t:'pg',q:'',o:['','','','',''],k:0,w:2};
 const o=(q.o||[]).concat(['','','','','']).slice(0,5);
 const sel=(id,opts,v,ex)=>`<select id="${id}" ${ex||''} class="inp">${opts.map(([val,t])=>`<option value="${val}" ${String(val)===String(v)?'selected':''}>${t}</option>`).join('')}</select>`;
 const c=`<h3 class="ar text-xl font-bold text-emerald-800 mb-3">${idx>=0?'Edit soal no. '+(idx+1):'Tambah soal baru'}</h3>
 <div class="grid sm:grid-cols-2 gap-3 mb-3"><div><label class="text-sm">Jenis soal</label>${sel('et',[['pg','Pilihan Ganda'],['is','Isian Singkat'],['bs','Benar / Salah']],q.t,'onchange="typeChg()"')}</div>
 <div><label class="text-sm">Bobot</label><input id="ew" type="number" min="1" value="${q.w||2}" class="inp"></div></div>
 <label class="text-sm">Teks soal</label><textarea id="eq" rows="3" class="inp mb-3">${esc(q.q)}</textarea>
 <div id="bpg"><label class="text-sm">Pilihan jawaban</label>${o.map((x,j)=>`<div class="flex gap-2 items-center mb-2"><b class="w-5">${L[j]}</b><input id="eo${j}" class="inp" value="${esc(x)}"></div>`).join('')}
 <label class="text-sm">Kunci jawaban</label>${sel('ek',L.split('').map((l,j)=>[j,l]),q.k)}</div>
 <div id="bbs"><label class="text-sm">Kunci jawaban</label>${sel('eb',[['1','Benar'],['0','Salah']],q.k===true?'1':'0')}</div>
 <div id="bis"><label class="text-sm">Kunci (kata kunci, pisahkan dengan koma)</label><input id="ei" class="inp" value="${q.t==='is'&&!q.g?esc((q.k||[]).join(', ')):''}" placeholder="contoh: biaya peluang, opportunity cost">${q.g?'<p class="text-xs text-slate-500 mt-1">Soal ini dinilai dengan 2 poin jawaban. Isi kolom ini untuk menggantinya dengan kata kunci biasa.</p>':''}</div>
 <div class="flex gap-2 mt-4"><button onclick="adminView('soal')" class="flex-1 py-2 rounded-lg bg-slate-200">Batal</button><button onclick="saveQ(${idx})" class="flex-1 py-2 rounded-lg btn-green">Simpan</button></div>`;
 adminShell('soal',c);typeChg();
}
function typeChg(){const t=$('#et').value;$('#bpg').style.display=t==='pg'?'':'none';$('#bbs').style.display=t==='bs'?'':'none';$('#bis').style.display=t==='is'?'':'none'}
function saveQ(idx){
 const t=$('#et').value,q=$('#eq').value.trim(),w=Math.max(1,+$('#ew').value||2);let it;
 if(!q){alert('Teks soal wajib diisi');return}
 if(t==='pg'){
  const op=[0,1,2,3,4].map(j=>$('#eo'+j).value.trim());
  if(op.filter(Boolean).length<2){alert('Isi minimal 2 pilihan');return}
  const k=+$('#ek').value;if(!op[k]){alert('Kunci menunjuk pilihan yang kosong');return}
  it={t,q,o:op,k,w};
 }else if(t==='bs')it={t,q,k:$('#eb').value==='1',w};
 else{
  const ks=$('#ei').value.split(',').map(norm).filter(Boolean),old=idx>=0?AD.soal[idx]:null;
  if(!ks.length&&!(old&&old.g)){alert('Isi minimal 1 kata kunci');return}
  it=ks.length?{t,q,k:ks,w}:{t,q,k:[],g:old.g,w};
 }
 const a=AD.soal.slice();if(idx>=0)a[idx]=it;else a.push(it);
 adm('asoal',{soal:a},'soal');
}
function delQ(i){if(confirm('Hapus soal no. '+(i+1)+'?'))adm('asoal',{soal:AD.soal.filter((_,j)=>j!==i)},'soal')}

/* ===== ANTI-CURANG ===== */
document.addEventListener('contextmenu',e=>e.preventDefault());
['copy','cut','paste'].forEach(t=>document.addEventListener(t,e=>{if(S&&!S.done)e.preventDefault()}));
document.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))||(e.ctrlKey&&['u','s','p'].includes(k)))e.preventDefault();
});
document.addEventListener('visibilitychange',()=>{
 if(!S||S.done)return;
 if(document.hidden){S.viol++;sv(SK,S);call('viol',{nama:S.nama,token:S.token,count:S.viol});return}
 call('viol',{nama:S.nama,token:S.token,count:S.viol});
 if(S.viol>=CFG.maxViol){submit(false,true);return}
 drawNav();
 modal(`<h3 class="ar font-bold text-xl text-red-600 mb-2">Pelanggaran Terdeteksi</h3><p class="text-sm mb-4">Kamu keluar dari halaman ujian. Ini pelanggaran ke-${S.viol} dari ${CFG.maxViol}. Pada pelanggaran ke-${CFG.maxViol} akunmu akan diblokir dan jawaban dikirim otomatis.</p><button onclick="closeModal()" class="w-full py-2 rounded-lg bg-red-600 text-white">Saya mengerti</button>`);
});

/* ===== PULIHKAN SESI ===== */
(function(){
 const o=ld(SK,null);
 if(!o||!o.soal){loginView();return}
 S=o;Q=o.soal;
 if(o.viol>=CFG.maxViol){loginView();submit(false,true)}
 else if(o.end<=Date.now()){loginView();submit(true)}
 else examView();
})();
</script>
</body></html>
